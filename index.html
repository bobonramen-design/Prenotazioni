<style>
:root{--bg:#fff;--alt:#f3f3f3;--ink:#2b2d31;--mut:#777b82;--line:#d9dbde;--side:#3b3e43;--sideink:#e9eaec;--acc:#e0aa2e;--accink:#2b2d31;--now:#e2631f;--bad:#b3402b;--card:#fff;

html,body{height:100%;margin:0}

body{background:var(--bg);color:var(--ink);font:15px/1.4 Poppins,system-ui,sans-serif;display:flex}

nav{width:76px;background:var(--side);color:var(--sideink);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;flex-shrink:0}

#app{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}

.bar span{padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem}
.bar.un{border-style:dashed}

.lab.late{background:#f6d4d3;color:#8f1f1b}.lab.late small{color:#8f1f1b}

.now{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:3;pointer-events:none}
.now:before{content:"";position:absolute;top:30px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.pg{padding:16px;overflow:auto;flex:1}
.card{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px;max-width:720px}
.card h2{margin:0 0 10px;font-size:1.05rem;font-weight:500}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.it .g{flex:1;min-width:0}.mut{color:var(--mut);font-size:.85rem}
.b{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px}
.b.p{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:500}
.b.d{color:var(--bad)}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--ink);width:min(440px,94vw);padding:20px}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 12px;font-weight:500;font-size:1.2rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;font-size:.76rem;color:var(--mut);margin-bottom:2px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acts .sp{flex:1}
.empty{color:var(--mut);padding:12px 0}
@media(max-width:600px){nav{width:58px}nav button{width:54px;font-size:.58rem}.top h1{font-size:1.4rem}.dn input{width:120px}}
</style>

<body>
<div id="lg" hidden><div class="lgc"><h2>Accedi</h2><p class="mut" style="margin:0 0 12px">Entra con l'email e la password del ristorante per vedere le stesse prenotazioni su tutti i dispositivi.</p>
<label for="lgm">Email</label><input id="lgm" type="email" autocomplete="username" inputmode="email" style="margin-bottom:10px">
<label for="lgp">Password</label><input id="lgp" type="password" autocomplete="current-password">
<div id="lge" style="color:var(--bad);min-height:1.4em;margin:8px 0;font-size:.88rem"></div>
<button class="b p" id="lgb" style="width:100%">Accedi</button></div></div>
<nav>
  <div class="clock"><span id="clk">--:--</span><small id="cd"></small></div>
  <button data-v="tl" class="on"><svg viewBox="0 0 24 24"><path d="M3 9h18M5 9v10M19 9v10M8 9V5h8v4M9 14h6"/></svg>Tavoli</button>
  <button data-v="list"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Prenotazioni</button>
  <button data-v="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Gestione</button>
</nav>
<div id="app">
  <div class="top">
    <h1 id="ttl">Tavoli</h1>
    <div class="seg" id="seg"><button data-s="p">Pranzo</button><button data-s="c">Cena</button><button data-s="a">Tutto</button></div>
    <div class="stats"><div><b id="s1"></b> assegnato</div><div><b id="s2"></b> capienza</div><div><b id="s3"></b> arrivati</div><div id="sy" style="color:var(--mut)"></div></div>
    <div class="dn"><button id="prev" aria-label="Giorno precedente">‹</button><input type="date" id="date" aria-label="Data"><button id="next" aria-label="Giorno successivo">›</button></div>
    <button class="plus" id="add" aria-label="Nuova prenotazione">+</button>
  </div>
  <div id="main" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
</div>

<dialog id="dlg">
  <h2 id="dt">Nuova prenotazione</h2>
  <div class="g2"><div><label for="rn">Nome</label><input id="rn" list="cl" autocomplete="off"><datalist id="cl"></datalist></div><div><label for="rp">Telefono</label><input id="rp" type="tel"></div></div>
  <div class="g2"><div><label for="rh">Ora</label><input id="rh" type="time" step="900"></div><div><label for="rg">Persone</label><input id="rg" type="number" min="1"></div></div>
  <div class="g2"><div><label for="rd">Durata</label><select id="rd"></select></div><div><label for="rt">Tavolo</label><select id="rt"></select></div></div>
  <div style="margin-bottom:10px"><label class="ck"><input type="checkbox" id="ra"> Cliente arrivato</label></div>
  <div style="margin-bottom:10px"><label>Unisci altri tavoli</label><div id="mg"></div></div>
  <div><label for="ro">Note</label><input id="ro"></div>
  <div id="er" class="mut" style="color:var(--bad);margin-top:8px"></div>
  <div class="acts"><button class="b d" id="del">Elimina</button><span class="sp"></span><button class="b" id="can">Annulla</button><button class="b p" id="ok">Salva</button></div>
</dialog>
<div id="toast" hidden><span id="tm"></span><button id="tu">Annulla</button></div>
<input type="file" id="cfile" accept=".csv,.vcf,text/csv,text/vcard,text/x-vcard" hidden>
<input type="file" id="file" accept="application/json" hidden>

<script>
const KEY="prenotazioni-ristorante-v1",LW=64;let START=0,END=0,PX=2.5,SV={p:[12,15],c:[19,23]},svc="a";
try{const g=JSON.parse(localStorage.getItem("pr-svc")||"null");if(g&&g.p&&g.c)SV=g}catch(e){}
const CUT=()=>(SV.p[1]+SV.c[0])*30;
const cls=t=>{const[a,b]=t.split(":").map(Number);return a*60+b<CUT()?"p":"c"};
function applySvc(){const[a,b]=svc==="p"?SV.p:svc==="c"?SV.c:[SV.p[0],SV.c[1]];START=a*60;END=b*60}
svc=new Date().getHours()*60<CUT()?"p":"c";applySvc();
let S={tables:[],res:[]},view="tl",editing=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mins=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const day=()=>$("date").value;
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return}}catch(e){}
  S={tables:Array.from({length:9},(_,i)=>({id:uid()+i,name:String(i+1).padStart(2,"0"),seats:4})),res:[]}}
let CT=[];try{CT=JSON.parse(localStorage.getItem("pr-contacts")||"[]")}catch(e){}
function parseCsv(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}
  else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";if(r.some(x=>x))rows.push(r);r=[]}else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows}
function parseContacts(t){
  t=t.replace(/^\uFEFF/,"");const out=[];
  if(/BEGIN:VCARD/i.test(t)){
    t.replace(/\r/g,"").replace(/\n[ \t]/g,"").split(/BEGIN:VCARD/i).slice(1).forEach(v=>{
      let n=((v.match(/^FN[^:\n]*:(.*)$/mi)||[])[1]||"").trim();
      if(!n){const m=v.match(/^N[^:\n]*:(.*)$/mi);if(m)n=m[1].split(";").map(x=>x.trim()).filter(Boolean).reverse().join(" ")}
      const p=((v.match(/^TEL[^:\n]*:(.*)$/mi)||[])[1]||"").trim();
      if(n)out.push({n,p})});
  }else{
    const rows=parseCsv(t);if(rows.length<2)return out;
    const h=rows[0].map(x=>x.trim().toLowerCase()),f=re=>h.findIndex(x=>re.test(x));
    const ni=f(/^name$/),fi=f(/^(first name|given name|nome)$/),li=f(/^(last name|family name|cognome)$/),pi=f(/(phone|telefono).*(value|valore)|^(phone|telefono)/);
    rows.slice(1).forEach(r=>{
      let n=ni>=0?(r[ni]||"").trim():"";
      if(!n)n=[fi>=0?r[fi]:"",li>=0?r[li]:""].map(x=>(x||"").trim()).filter(Boolean).join(" ");
      const p=pi>=0?(r[pi]||"").split(":::")[0].trim():"";
      if(n)out.push({n,p})});
  }
  const seen=new Set();return out.filter(c=>{const k=c.n.toLowerCase()+"|"+c.p;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.n.localeCompare(b.n));
}
function drawCl(){const q=$("rn").value.trim().toLowerCase(),d=q.replace(/\D/g,"");
  const m=q.length<2?[]:CT.filter(c=>c.n.toLowerCase().includes(q)||(d.length>=3&&c.p.replace(/\D/g,"").includes(d))).slice(0,8);
  $("cl").innerHTML=m.map(c=>`<option value="${esc(c.n)}" label="${esc(c.p)}"></option>`).join("")}
$("rn").oninput=drawCl;
$("rn").onchange=()=>{const c=CT.find(x=>x.n.toLowerCase()===$("rn").value.trim().toLowerCase());if(c&&c.p&&!$("rp").value.trim())$("rp").value=c.p};
$("rp").onchange=()=>{const d=$("rp").value.replace(/\D/g,"");if(d.length<6||$("rn").value.trim())return;const c=CT.find(x=>x.p.replace(/\D/g,"").endsWith(d.slice(-9)));if(c)$("rn").value=c.n};
let ref=null,busy=false,again=false,lastVer="";
const setSy=t=>{const e=document.getElementById("sy");if(e)e.textContent=t};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()}
function push(){
  if(!ref)return;if(busy){again=true;return}
  busy=true;lastVer=uid();
  ref.set({tables:S.tables,res:S.res,ver:lastVer}).then(()=>setSy("Salvato online")).catch(e=>setSy(e&&e.code==="invalid_argument"?"Sola lettura: non puoi modificare":"Online non riuscito, riprovo al prossimo salvataggio")).finally(()=>{busy=false;if(again){again=false;push()}});
}
let unsub=null,USER=null;
const showLogin=v=>{$("lg").hidden=!v};
function handleSnap(exists,raw,fromCache){
  if(!exists){if(!fromCache)push();return}
  const d=JSON.parse(JSON.stringify(raw));
  if(d.ver===lastVer)return;
  if(!Array.isArray(d.tables)||!Array.isArray(d.res))return;
  S={tables:d.tables,res:d.res};
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  setSy("Salvato online");
  if(!$("dlg").open&&!document.querySelector(".bar[style*=translate]"))render();
}
function initFb(){
  const A=window.FBAPI;
  A.onAuth(u=>{
    if(unsub){unsub();unsub=null}
    USER=u?u.email:null;
    if(!u){ref=null;showLogin(true);setSy("Accedi per salvare online");return}
    showLogin(false);setSy("Collegamento…");
    ref={set:d=>A.save(d)};
    unsub=A.listen(snap=>handleSnap(snap.exists(),snap.data(),snap.metadata.fromCache),e=>setSy(e&&e.code==="permission-denied"?"Accesso negato: controlla le regole":"Online non disponibile"));
    if(view==="set")render();
  });
}
function initDb(){
  if(window.FBAPI)return initFb();
  addEventListener("fbready",initFb,{once:true});
  setTimeout(()=>{if(!window.FBAPI)setSy("Solo su questo dispositivo")},6000);
}
async function doLogin(){
  $("lge").textContent="";$("lgb").disabled=true;
  try{await window.FBAPI.login($("lgm").value.trim(),$("lgp").value);$("lgp").value=""}
  catch(e){const c=e&&e.code||"";$("lge").textContent=!window.FBAPI?"Servizio non raggiungibile. Controlla la connessione.":/invalid|wrong|user-not-found/.test(c)?"Email o password non corretti.":c==="auth/too-many-requests"?"Troppi tentativi. Riprova tra qualche minuto.":c==="auth/network-request-failed"?"Connessione assente.":"Accesso non riuscito ("+c+")."}
  $("lgb").disabled=false;
}
$("lgb").onclick=doLogin;
